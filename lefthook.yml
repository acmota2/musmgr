pre-commit:
  parallel: true
  commands:
    backend:
      glob: "*.go"
      root: backend
      run: |
        set -e
        gofmt -w {staged_files}
        go vet ./...
    frontend:
      root: frontend
      glob:
        - "frontend/src/*.{css,ts,svelte}"
        - "frontend/src/**/*.{css,ts,svelte}"
        - "frontend/*.{js,json,ts}"
      run: biome check --write {staged_files}
