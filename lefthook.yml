pre-commit:
  parallel: true
  commands:
    backend:
      glob: "*.go"
      root: backend
      run: |
        set -e
        gofmt -w {staged_files}
        go vet ./...

    frontend:
      root: frontend
      glob:
        - "frontend/src/*.{css,ts,svelte}"
        - "frontend/src/**/*.{css,ts,svelte}"
        - "frontend/*.{js,json,ts}"
      run: biome check --write {staged_files}

pre-push:
  parallel: true
  commands:
    backend:
      glob: "backend/**"
      exclude:
        - "^backend/db/.*"
      run: |
        set -e
        docker compose build go-gin

    frontend:
      glob: "frontend/**"
      run: |
        set -e
        docker compose build svelte-frontend

    database:
      glob: "backend/db/**"
      run: |
        set -e
        docker compose build database
