services:
  adminer:
    profiles: ["local", "dev"]
    image: adminer:5.4.1
    container_name: musmgr-adminer
    networks:
      - musmgr
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - ${ADMINER_PORT:-8080}:8080

  database:
    profiles: ["bootstrap", "local"]
    build:
      context: ./backend/db
    container_name: musmgr-goose-database
    networks:
      - musmgr
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-musmgr}?sslmode=disable
    command: ["up", "-dir", "migrations"]

  rustfs:
    profiles: ["local", "dev"]
    image: rustfs/rustfs:latest
    container_name: musmgr-rustfs
    volumes:
      - rustfs-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS}
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    networks:
      - musmgr

  postgres:
    profiles: ["bootstrap", "local", "dev"]
    image: postgres:18.1
    container_name: musmgr-db
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    networks:
      - musmgr
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-musmgr}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  frontend-admin:
    profiles: ["dev"]
    build:
      context: ./frontend
      args:
        VITE_FRONTEND_BUILD_MODE: admin
    container_name: musmgr-frontend-admin
    environment:
      API_URL: http://go-gin:4700
      ORIGIN: ${ADMIN_ORIGIN}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-2097152}
    ports:
      - 3000:3000
    networks:
      - musmgr

  frontend-public:
    profiles: ["dev"]
    build:
      context: ./frontend
      args:
        VITE_FRONTEND_BUILD_MODE: public
    container_name: musmgr-frontend-public
    environment:
      API_URL: http://go-gin:4701
      ORIGIN: ${PUBLIC_ORIGIN}
    ports:
      - 3001:3000
    networks:
      - musmgr

  go-gin:
    profiles: ["local", "dev"]
    build:
      context: ./backend
    container_name: musmgr-backend
    command: /app/main --storage-type S3
    ports:
      - ${ADMIN_PORT:-4700}:4700
      - ${PUBLIC_PORT:-4701}:4701
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-rustfs:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-localhost:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${RUSTFS_ACCESS_KEY}}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${RUSTFS_SECRET_KEY}}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-musmgr}
      S3_BUCKET_REGION: ${S3_BUCKET_REGION:-us-east-1}
      S3_SSL: ${S3_SSL:-false}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-false}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      ALLOWED_ADMIN_DOMAINS: ${ALLOWED_ADMIN_DOMAINS:-'["localhost"]'}
      ALLOWED_PUBLIC_DOMAINS: ${ALLOWED_PUBLIC_DOMAINS:-'["localhost"]'}
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      rustfs:
        condition: service_started
    networks:
      - musmgr

networks:
  musmgr:
    driver: bridge

volumes:
  rustfs-data:
