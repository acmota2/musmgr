name: Build and push images

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
jobs:
  build:
    runs-on: ubuntu-24.04
    environment: main
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            image_suffix: backend
            build_args: ""
          - name: frontend-public
            context: frontend
            image_suffix: frontend-public
            build_args: |
              VITE_FRONTEND_BUILD_MODE=public
          - name: frontend-admin
            context: frontend
            image_suffix: frontend-admin
            build_args: |
              VITE_FRONTEND_BUILD_MODE=admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: vars
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/musmgr-${{ matrix.image_suffix }}:${{ steps.vars.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/musmgr-${{ matrix.image_suffix }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ matrix.build_args }}
